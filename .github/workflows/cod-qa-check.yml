name: NEXORA COD branch checks

on:
  workflow_dispatch:
  push:
    branches:
      - 'cod-idempotency-qa-*'
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'server.js'
      - 'package.json'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check COD migration safety invariants
        run: python scripts/check-cod-migration.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qa-only-password
          POSTGRES_DB: nexora_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable schema matching live column metadata
        env:
          PGPASSWORD: qa-only-password
        run: psql -h localhost -U postgres -d nexora_qa -v ON_ERROR_STOP=1 -f scripts/cod-qa-bootstrap.sql
      - name: Apply COD migrations to disposable PostgreSQL only
        env:
          PGPASSWORD: qa-only-password
        run: |
          psql -h localhost -U postgres -d nexora_qa -v ON_ERROR_STOP=1 -f supabase/migrations/202611190001_cod_checkout_idempotency.sql
          psql -h localhost -U postgres -d nexora_qa -v ON_ERROR_STOP=1 -f supabase/migrations/202611200001_cod_checkout_acl_hardening.sql
          psql -h localhost -U postgres -d nexora_qa -v ON_ERROR_STOP=1 -f supabase/migrations/202611210001_product_stock_guard_alignment.sql
          psql -h localhost -U postgres -d nexora_qa -v ON_ERROR_STOP=1 -f supabase/migrations/202611240001_cod_order_items_order_id_index.sql
      - name: Run COD retry and privilege integration checks
        env:
          PGPASSWORD: qa-only-password
        run: psql -h localhost -U postgres -d nexora_qa -v ON_ERROR_STOP=1 -f scripts/cod-qa-integration.sql
      - name: Run concurrent retry and cart-snapshot checks
        env:
          PGPASSWORD: qa-only-password
        run: python scripts/cod-qa-concurrency.py
