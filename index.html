<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#091224">
  <meta name="description" content="NEXORA MARKET — a live Supabase-backed marketplace with a clearly separated demo preview">
  <title>NEXORA MARKET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <a class="brand" href="#home"><span class="brand-mark">N</span><span>NEXORA <b>MARKET</b></span></a>
      <div class="search"><span>⌕</span><input id="search" placeholder="Search products / ပစ္စည်းရှာရန်"><kbd>⌘ K</kbd></div>
      <div class="top-actions"><button class="lang" id="langBtn">မြန်မာ</button><button class="round" id="wishBtn" aria-label="Wishlist">♡<i id="wishCount">0</i></button><button class="round" id="cartBtn" aria-label="Cart">▱<i id="cartCount">0</i></button><button class="profile-btn" id="profileBtn"><span class="avatar">D</span><span class="profile-name">Sign in</span><b>⌄</b></button></div>
    </header>
    <div class="mobile-search search"><span>⌕</span><input id="mobileSearch" placeholder="Search / ရှာရန်"></div>
    <nav class="nav"><div class="nav-inner"><button class="nav-link active" data-view="home">Discover</button><button class="nav-link" data-view="categories">Categories</button><button class="nav-link" data-view="wishlist">Wishlist</button><button class="nav-link" data-view="orders">My orders</button><button class="nav-link" data-view="seller">Seller hub</button><button class="nav-link" data-view="admin">Admin console</button><span class="nav-spacer"></span><span class="safe-note">Connecting to live database…</span></div></nav>
    <main id="main"></main>
    <nav class="bottom-nav"><button data-view="home" class="active">⌂<small>Home</small></button><button data-view="categories">▦<small>Categories</small></button><button id="mobileCart">▱<small>Cart</small></button><button data-view="orders">⌑<small>Orders</small></button><button id="mobileProfile">◎<small>Account</small></button></nav>
    <div id="drawer"></div><div id="toast" role="status"></div>
  </div>
  <script src="/config.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="/app.js"></script>
</body>
</html>
